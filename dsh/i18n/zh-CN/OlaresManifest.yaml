metadata:
  title: DeepSeek Harness
  description: 深度求索开源智能体框架，一切皆插件。
spec:
  fullDescription: |
    **概述**

    DeepSeek Harness（`dsh`）是由
    [DeepSeek AI](https://deepseek.com) 开发的开源智能体框架。它构建于
    **一切皆插件** 的架构之上，并由
    [Cordis](https://github.com/cordiverse/cordis) 驱动。你可以把实际工作交给智能体完成，并在浏览器中直接查看它的计划、文件改动和终端输出。

    **核心特性**

    - **带会话与工作区的 Web UI** — 新建、归档和搜索会话；置顶与归档条目可在重启后恢复。
    - **一切皆插件** — 通过内置插件管理器安装、启用、停用和重新配置插件，无需重启。
    - **可见的工作过程** — 流式输出与工具调用、可左右对照审阅的文件差异，以及多标签侧边栏终端。
    - **模型路由** — 自带模型：支持 DeepSeek API 或任何 OpenAI / Anthropic 兼容端点，在 设置→模型 中配置，下次请求即生效。
    - **Olares 上的本地 AI** — 在自定义 Provider 中填入 Olares 上已安装的模型应用（例如 Ollama 引擎基础应用）的集群内服务地址，即可像其他 Provider 一样路由到本地模型。
    - **MCP 支持** — 连接 MCP 服务器，在会话中使用其工具与共享资源。

    **Olares 用户须知**

    - DeepSeek Harness 为上游*开发者预览版*，迭代迅速——各版本之间可能出现不兼容变更。本应用按发布固定镜像版本。
    - 全部智能体状态（凭据、设置、会话、工作区）持久保存在应用的数据卷中，升级不会丢失。
    - 本图表通过 Olares 入口提供 Web UI，并附带一个小型反向代理边车来归一化响应压缩，保证设置页面在 Olares 域名下完全可用。