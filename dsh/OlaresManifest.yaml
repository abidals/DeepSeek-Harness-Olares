"olaresManifest.version": '0.12.0'
"olaresManifest.type": app
apiVersion: v3
metadata:
  name: dsh
  appid: dsh
  title: DeepSeek Harness
  description: Open-source agent harness by DeepSeek AI - everything is a plugin. Web UI with sessions, workspaces and model routing.
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/deepseek-dark.svg
  version: 0.1.3
  categories:
  - AI
entrances:
- name: dsh
  host: dsh-svc
  port: 3080
  title: DeepSeek Harness
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/deepseek-dark.svg
  authLevel: private
  invisible: false
spec:
  versionName: "0.1.2-rc.1"
  supportArch:
  - amd64
  runAsUser: true
  requiredCpu: '0.5'
  limitedCpu: '4'
  requiredMemory: 1024Mi
  limitedMemory: 4096Mi
  requiredDisk: 2Gi
  developer: DeepSeek AI
  website: https://deepseek.com/harness
  sourceCode: https://github.com/deepseek-ai/deepseek-harness
  doc: https://deepseek-harness.github.io/deepseek-harness/
  license:
  - text: MIT
    url: https://github.com/deepseek-ai/deepseek-harness/blob/master/LICENSE
  locale:
  - en-US
  - zh-CN
  submitter: abidals
  fullDescription: |
    **Overview**

    DeepSeek Harness (`dsh`) is an open-source agent harness developed by
    [DeepSeek AI](https://deepseek.com). It is built on an
    **everything is a plugin** architecture and powered by Cordis.

    The Web UI ships with session management, workspaces and model routing:
    start sessions, delegate coding work to the agent, and follow its plan
    and deliverables from any browser.

    **Notes for Olares users**

    This is an upstream *developer preview* and iterates rapidly —
    compatibility-breaking changes are expected.

    Providers, API keys and model routing are configured from the Web UI:
    open Settings → Models and add the DeepSeek API key or any custom
    OpenAI-compatible provider; changes apply on the next request and are
    persisted in the app data directory without restarting.

    The chart ships a lightweight reverse-proxy sidecar that removes the
    response compression the upstream bundle's own compression guard does
    not handle, so the Web UI keeps its Settings pages available when the
    app is served over the Olares domain (an upstream loopback check would
    otherwise disable them).
permission:
  appData: true
envs:
- envName: PROXY_USERNAME
  required: false
  type: string
  editable: false
  description: Optional HTTP Basic Auth username for the Web UI (leave empty to disable; Olares entrance auth still applies)
- envName: PROXY_PASSWORD
  required: false
  type: password
  editable: false
  description: Optional HTTP Basic Auth password (auth is enabled only when both username and password are set)
options:
  apiTimeout: 0
  dependencies:
  - name: olares
    version: '>=1.12.6-0'
    type: system
workloadReplicas:
  dsh: 1