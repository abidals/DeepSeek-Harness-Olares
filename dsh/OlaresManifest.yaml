entrances:
- name: dsh
  host: dsh-svc
  port: 3080
  title: DeepSeek Harness
  icon: https://raw.githubusercontent.com/abidals/DeepSeek-Harness-Olares/main/assets/icon/dsh-256.png
  authLevel: private
  invisible: false
spec:
  versionName: "0.1.7-rc.2"
  featuredImage: https://raw.githubusercontent.com/abidals/DeepSeek-Harness-Olares/main/assets/listing/1.png
  promoteImage:
  - https://raw.githubusercontent.com/abidals/DeepSeek-Harness-Olares/main/assets/listing/1.png
