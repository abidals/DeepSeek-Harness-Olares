  - en-US
  - zh-CN
  submitter: abidals
  fullDescription: |
    **Overview**

    DeepSeek Harness (`dsh`) is an open-source agent harness developed by
    [DeepSeek AI](https://deepseek.com). It is built on an **everything is a
    plugin** architecture and powered by
    [Cordis](https://github.com/cordiverse/cordis). You delegate real work to
    an agent and follow its plan, file changes and terminal output directly
    in the browser.

    **Key features**

    - **Web UI with sessions and workspaces** — start, archive and search
      sessions; pinned and archived entries recover across restarts.
    - **Everything is a plugin** — install, enable, disable and reconfigure
      plugins from the built-in plugin manager, without restarting.
    - **Visible work process** — streaming output and tool calls, file diffs
      with side-by-side review, and a multi-tab sidebar terminal.
    - **Model routing** — bring your own provider: the DeepSeek API or any
      OpenAI-compatible / Anthropic-compatible endpoint, configured from
      Settings → Models; the route applies on the next request.
    - **Local AI on Olares** — point a custom provider at any model app
      installed on your Olares (for example an Ollama engine base) using its
      in-cluster service URL, and route to it like any other provider.
    - **MCP support** — connect Model Context Protocol servers and use their
      tools and shared resources inside sessions.

    **Notes for Olares users**

    - DeepSeek Harness is an upstream *developer preview* and iterates
      rapidly — compatibility-breaking changes are expected between
      releases. This app pins the image tag per release.
    - All agent state (credentials, settings, sessions, workspaces) persists
      in the app's Data volume and survives upgrades.
    - The chart serves the Web UI through the Olares entrance with a small
      reverse-proxy sidecar that normalizes response compression, keeping
      the Settings pages fully usable over the Olares domain.
permission:
  appData: true
envs:
- envName: PROXY_USERNAME
  required: false
  type: string
  editable: true
  applyOnChange: true
  description: Optional HTTP Basic Auth username for the Web UI (leave empty to disable; Olares entrance auth still applies)
- envName: PROXY_PASSWORD
  required: false
  type: password
  editable: true
  applyOnChange: true
  description: Optional HTTP Basic Auth password (auth is enabled only when both username and password are set)
options:
  apiTimeout: 0
  dependencies:
  - name: olares
    version: '>=1.12.6-0'
    type: system
workloadReplicas:
  dsh: 1